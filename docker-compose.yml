services:
  migrate:
    image: ai-summary-project-backend
    container_name: ai-summary-migrate
    command: php artisan migrate --force
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    image: ai-summary-project-backend
    container_name: ai-summary-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: ai-summary-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app-network

  queue:
    image: ai-summary-project-backend
    container_name: ai-summary-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --sleep=3 --timeout=600
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  scheduler:
    image: ai-summary-project-backend
    container_name: ai-summary-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      API_INTERNAL_URL: http://nginx
    container_name: ai-summary-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: ai-summary-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ai_summary}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: ai-summary-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data: